{% extends "index.html" %}
{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout1.css') }}">
{% endblock %}

{% block content %}
    <form id="upload_image" method="post" enctype="multipart/form-data" action="{{url_for('upload_image')}}">
        <input id="choose_image" type="file" name="image" accept="image/*"  required/>
        <div id="imagePreview">Choose image</div>
        <button id="upload" type="submit" style="display: none;">Upload image</button>
    </form>
        <h2 id="select_effect">Pick an effect to preview</h2>
    <div id="previews">
        <ul id="select_preview">
            <li id="zoom">Zoom-In</li>
            <li id="circular">Circular pan</li>
            <li id="swing">Swing</li>
            <li id="dolly">Dolly zoom</li>
        </ul>
        <div id="preview_video">Select effect to view</div>
        <button id="download">Download</button>
    </div>
{% endblock %}
